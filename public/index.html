<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlowForge — Workflows</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        /* Page-specific styles */
        .workflow-count {
            color: var(--text-dim);
            font-size: var(--text-sm);
        }

        .workflow-list {
            display: flex;
            flex-direction: column;
            gap: var(--space-3);
        }

        .workflow-row {
            display: flex;
            align-items: center;
            gap: var(--space-5);
            padding: var(--space-4) var(--space-5);
            transition: background 0.15s, border-color 0.15s;
        }
        .workflow-row:hover {
            background: var(--surface-2);
            border-color: var(--border-strong);
        }

        .workflow-row .card-left {
            flex: 1 1 auto;
            min-width: 0;
        }
        .workflow-row .card-right {
            flex: 0 0 auto;
            display: flex;
            gap: var(--space-2);
        }

        .workflow-name {
            display: flex;
            align-items: center;
            gap: var(--space-2);
            margin-bottom: var(--space-1);
            font-size: var(--text-base);
            font-weight: 600;
        }
        .workflow-name span {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .workflow-meta {
            color: var(--text-dim);
            font-size: var(--text-sm);
        }

        .result-strip {
            display: none;
            margin-top: var(--space-3);
            padding-top: var(--space-3);
            border-top: 1px solid var(--border);
            align-items: center;
            gap: var(--space-2);
        }
        .result-strip.visible {
            display: flex;
        }

        @media (max-width: 640px) {
            .workflow-row {
                flex-wrap: wrap;
                gap: var(--space-3);
            }
            .workflow-row .card-left {
                width: 100%;
            }
            .workflow-row .card-right {
                width: 100%;
                justify-content: flex-start;
            }
        }
    </style>
</head>
<body>
    <div class="toolbar">
        <div class="brand">
            <span class="brand-mark"></span>
            FlowForge
        </div>
        <div class="toolbar-spacer"></div>
        <button id="newWorkflowBtn" class="btn btn-primary">New workflow</button>
        <button id="logoutBtn" class="btn btn-ghost">Log out</button>
    </div>

    <div class="page">
        <div class="page-header">
            <h1>Workflows</h1>
            <div class="toolbar-spacer"></div>
            <div id="workflowCount" class="workflow-count" hidden></div>
        </div>

        <div id="errorBanner" class="banner" hidden></div>

        <div id="workflowList"></div>
    </div>

    <script src="/js/app.js"></script>
    <script>
        // Module-level state
        let workflows = [];
        let errorTimer = null;

        // DOM references
        let newWorkflowBtn;
        let logoutBtn;
        let workflowCount;
        let errorBanner;
        let workflowList;

        // Initialize the page
        async function init() {
            try {
                await requireAuth();
                cacheElements();
                attachListeners();
                await loadWorkflows();
            } catch (err) {
                showError(err.message || 'Failed to initialize');
            }
        }

        // Cache DOM elements
        function cacheElements() {
            newWorkflowBtn = document.getElementById('newWorkflowBtn');
            logoutBtn = document.getElementById('logoutBtn');
            workflowCount = document.getElementById('workflowCount');
            errorBanner = document.getElementById('errorBanner');
            workflowList = document.getElementById('workflowList');
        }

        // Attach event listeners
        function attachListeners() {
            newWorkflowBtn.addEventListener('click', handleCreate);
            logoutBtn.addEventListener('click', handleLogout);
        }

        // Load workflows from API
        async function loadWorkflows() {
            try {
                const data = await apiFetch('/api/workflows');
                if (data.error) {
                    showError(data.error);
                    workflows = [];
                } else {
                    workflows = data.workflows || [];
                }
                renderList();
            } catch (err) {
                showError('Failed to load workflows: ' + err.message);
                workflows = [];
                renderList();
            }
        }

        // Render the workflow list or empty state
        function renderList() {
            workflowList.innerHTML = '';

            if (workflows.length === 0) {
                renderEmptyState();
                updateCount();
                return;
            }

            const container = document.createElement('div');
            container.className = 'workflow-list';

            workflows.forEach(workflow => {
                container.appendChild(createRow(workflow));
            });

            workflowList.appendChild(container);
            updateCount();
        }

        // Render the empty state
        function renderEmptyState() {
            const emptyDiv = document.createElement('div');
            emptyDiv.className = 'empty-state';
            emptyDiv.innerHTML = `
                <h3>No workflows yet</h3>
                <p>Workflows connect triggers and actions into an automation you can run.</p>
                <button class="btn btn-primary">Create your first workflow</button>
            `;
            // Wire the button to the same create handler
            const btn = emptyDiv.querySelector('button');
            btn.addEventListener('click', handleCreate);
            workflowList.appendChild(emptyDiv);
        }

        // Update the count display
        function updateCount() {
            if (workflows.length === 0) {
                workflowCount.hidden = true;
                return;
            }
            workflowCount.hidden = false;
            workflowCount.textContent = workflows.length === 1 ?
                '1 workflow' : workflows.length + ' workflows';
        }

        // Create a workflow row element
        function createRow(workflow) {
            const card = document.createElement('div');
            card.className = 'card workflow-row';
            card.dataset.id = workflow.id;

            const timeStr = timeAgo(workflow.updated_at);
            const badgeClass = workflow.is_active ? 'badge-active' : 'badge-inactive';
            const badgeLabel = workflow.is_active ? 'Active' : 'Inactive';
            const toggleLabel = workflow.is_active ? 'Deactivate' : 'Activate';

            card.innerHTML = `
                <div class="card-left">
                    <div class="workflow-name">
                        <span>${escapeHtml(workflow.name)}</span>
                        <span class="badge ${badgeClass}">${badgeLabel}</span>
                    </div>
                    <div class="workflow-meta">Updated ${timeStr}</div>
                    <div class="result-strip" data-for="${workflow.id}"></div>
                </div>
                <div class="card-right">
                    <button class="btn btn-sm open-btn">Open</button>
                    <button class="btn btn-sm run-btn">
                        <span class="run-label">Run</span>
                    </button>
                    <button class="btn btn-sm btn-ghost toggle-btn">${toggleLabel}</button>
                    <button class="btn btn-sm btn-danger delete-btn">Delete</button>
                </div>
            `;

            // Attach event listeners
            const openBtn = card.querySelector('.open-btn');
            const runBtn = card.querySelector('.run-btn');
            const toggleBtn = card.querySelector('.toggle-btn');
            const deleteBtn = card.querySelector('.delete-btn');

            openBtn.addEventListener('click', () => {
                window.location.href = '/workflow.html?id=' + workflow.id;
            });

            runBtn.addEventListener('click', () => handleRun(workflow, runBtn));
            toggleBtn.addEventListener('click', () => handleToggle(workflow, card, toggleBtn));
            deleteBtn.addEventListener('click', () => handleDelete(workflow, card));

            return card;
        }

        // Handle create workflow
        async function handleCreate() {
            const name = window.prompt('Workflow name:');
            if (name === null) return;
            const trimmed = name.trim();
            if (trimmed === '') return;

            try {
                const data = await apiFetch('/api/workflows', {
                    method: 'POST',
                    body: { name: trimmed }
                });
                if (data.error) {
                    showError(data.error);
                    return;
                }
                // Redirect to the new workflow editor
                window.location.href = '/workflow.html?id=' + data.workflow.id;
            } catch (err) {
                showError('Failed to create workflow: ' + err.message);
            }
        }

        // Handle run workflow (this call blocks until completion)
        async function handleRun(workflow, button) {
            const runLabel = button.querySelector('.run-label');
            const originalLabel = runLabel.textContent;
            const resultStrip = document.querySelector(`.result-strip[data-for="${workflow.id}"]`);

            // Clear any previous result
            resultStrip.className = 'result-strip';
            resultStrip.innerHTML = '';

            // Disable button and show spinner
            button.disabled = true;
            runLabel.innerHTML = '<span class="spinner"></span> Running';

            try {
                const data = await apiFetch(`/api/workflows/${workflow.id}/run`, {
                    method: 'POST',
                    body: {}
                });
                if (data.error) {
                    showError(data.error);
                    return;
                }

                // Show result strip
                // Status values map directly onto the stylesheet's badge classes,
                // including the underscore in badge-pending_external.
                const status = data.execution.status;
                const badgeClass = 'badge-' + status;
                resultStrip.innerHTML = `
                    <span class="badge ${badgeClass}">${status}</span>
                    <a href="/execution.html?id=${data.execution.id}">View details →</a>
                `;
                resultStrip.classList.add('visible');
            } catch (err) {
                showError('Failed to run workflow: ' + err.message);
            } finally {
                // Restore button
                button.disabled = false;
                runLabel.textContent = originalLabel;
            }
        }

        // Handle toggle active/inactive
        async function handleToggle(workflow, card, button) {
            const newActive = !workflow.is_active;
            try {
                const data = await apiFetch(`/api/workflows/${workflow.id}`, {
                    method: 'PUT',
                    body: { is_active: newActive }
                });
                if (data.error) {
                    showError(data.error);
                    return;
                }

                // Update local state
                workflow.is_active = newActive;
                workflow.updated_at = data.workflow.updated_at;

                // Update UI
                const badge = card.querySelector('.badge');
                const meta = card.querySelector('.workflow-meta');
                if (newActive) {
                    badge.className = 'badge badge-active';
                    badge.textContent = 'Active';
                    button.textContent = 'Deactivate';
                } else {
                    badge.className = 'badge badge-inactive';
                    badge.textContent = 'Inactive';
                    button.textContent = 'Activate';
                }
                meta.textContent = 'Updated ' + timeAgo(workflow.updated_at);
            } catch (err) {
                showError('Failed to update workflow: ' + err.message);
            }
        }

        // Handle delete workflow
        async function handleDelete(workflow, card) {
            const confirmed = window.confirm('Delete this workflow?');
            if (!confirmed) return;

            try {
                const data = await apiFetch(`/api/workflows/${workflow.id}`, {
                    method: 'DELETE'
                });
                if (data.error) {
                    showError(data.error);
                    return;
                }

                // Remove from local array
                const idx = workflows.findIndex(w => w.id === workflow.id);
                if (idx !== -1) {
                    workflows.splice(idx, 1);
                }

                // Remove from DOM
                card.remove();

                // Re-render fully when the list empties so the now-empty row
                // container is torn down along with it.
                if (workflows.length === 0) {
                    renderList();
                } else {
                    updateCount();
                }
            } catch (err) {
                showError('Failed to delete workflow: ' + err.message);
            }
        }

        // Handle logout
        async function handleLogout() {
            try {
                await apiFetch('/api/auth/logout', { method: 'POST' });
                window.location.href = '/login.html';
            } catch (err) {
                // Even if logout fails, redirect to login
                window.location.href = '/login.html';
            }
        }

        // Show error banner
        function showError(message) {
            // Clear previous timer
            if (errorTimer) {
                clearTimeout(errorTimer);
            }

            errorBanner.textContent = message;
            errorBanner.hidden = false;

            // Auto-hide after 8 seconds
            errorTimer = setTimeout(() => {
                errorBanner.hidden = true;
            }, 8000);
        }

        // Format relative time
        function timeAgo(iso) {
            if (!iso) return '';

            const date = new Date(iso);
            if (isNaN(date.getTime())) return '';

            const now = new Date();
            const diffMs = now - date;
            const diffSec = Math.floor(diffMs / 1000);
            const diffMin = Math.floor(diffSec / 60);
            const diffHour = Math.floor(diffMin / 60);
            const diffDay = Math.floor(diffHour / 24);

            if (diffSec < 60) return 'just now';
            if (diffMin < 60) return diffMin + 'm ago';
            if (diffHour < 24) return diffHour + 'h ago';
            if (diffDay < 7) return diffDay + 'd ago';

            return date.toLocaleDateString();
        }

        // Start the app
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
