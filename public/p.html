<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><link rel="stylesheet" href="/css/style.css"><title>FlowForge Capsule</title></head><body><main class="page" style="max-width:680px"><div class="eyebrow">FlowForge Capsule</div><h1 id="title">Loading…</h1><p id="description" class="field-hint"></p><form id="controls" class="card" aria-live="polite"></form><p id="status" class="field-hint" role="status"></p><section id="result" class="card" hidden aria-live="polite"></section></main><script>
const token=location.pathname.split('/').pop(),form=document.querySelector('#controls'),status=document.querySelector('#status'),result=document.querySelector('#result');let pollTimer;
function showResult(data){result.replaceChildren();const out=data||{};if(out.text){const p=document.createElement('p');p.textContent=out.text;result.append(p)}if(out.payload!=null){const pre=document.createElement('pre');pre.textContent=JSON.stringify(out.payload,null,2);result.append(pre)};(out.artifacts||[]).forEach(a=>{if(a.url){const link=document.createElement('a');link.href=a.url;link.target='_blank';link.rel='noopener noreferrer';link.textContent=a.name||('Download '+(a.kind||'asset'));result.append(link)}});result.hidden=false}
async function poll(id){const r=await fetch('/api/public/'+encodeURIComponent(token)+'/executions/'+encodeURIComponent(id));const d=await r.json();if(d.error){status.textContent=d.error;return}const state=d.execution.status;status.textContent='Run '+state.replace('_',' ')+'…';if(state==='success'){status.textContent='Run complete.';showResult(d.execution.result);return}if(['failed','canceled'].includes(state)){status.textContent='Run '+state+'.';return}pollTimer=setTimeout(()=>poll(id),1500)}
fetch('/api/public/'+encodeURIComponent(token)+'/config').then(r=>r.json()).then(data=>{if(data.error)throw Error(data.error);title.textContent=data.publication.name;description.textContent=data.publication.description||'';(data.capsule.controls||[]).forEach(c=>{const w=document.createElement('label');w.className='field';w.textContent=c.label||c.key;const i=document.createElement('input');i.name=c.nodeId+'.'+c.key;i.value=c.default||'';w.append(i);form.append(w)});const b=document.createElement('button');b.className='btn btn-primary';b.textContent='Run Capsule';form.append(b)}).catch(e=>status.textContent=e.message);form.addEventListener('submit',async e=>{e.preventDefault();clearTimeout(pollTimer);result.hidden=true;const controls={};new FormData(form).forEach((v,k)=>{const [id,key]=k.split('.');if(key)(controls[id]??={})[key]=v});status.textContent='Starting…';const r=await fetch('/api/public/'+encodeURIComponent(token)+'/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({controls})});const d=await r.json();if(d.execution_id)poll(d.execution_id);else status.textContent=d.error||'Unable to start.'});
</script><script>new ResizeObserver(()=>parent.postMessage({type:'flowforge:height',height:document.body.scrollHeight},'*')).observe(document.body)</script></body></html>
