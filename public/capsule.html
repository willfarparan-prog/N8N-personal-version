<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Capsule — FlowForge</title>
<link rel="stylesheet" href="/css/style.css">
<style>
  body { min-height: 100%; background: var(--canvas); }
  .capsule-shell { min-height: 100vh; padding: clamp(1rem, 4vw, 4rem); background: radial-gradient(circle at 16% 0%, rgba(205, 101, 236, .27), transparent 30%), radial-gradient(circle at 88% 14%, rgba(255, 128, 147, .15), transparent 24%), radial-gradient(circle at 80% 100%, rgba(74, 195, 236, .11), transparent 30%); }
  .capsule-nav { display: flex; align-items: center; justify-content: space-between; max-width: 1120px; margin: 0 auto 4.5rem; }
  .capsule-nav .brand { font-size: var(--text-sm); }
  .capsule-layout { display: grid; grid-template-columns: minmax(0, .95fr) minmax(320px, .75fr); gap: clamp(2rem, 7vw, 7rem); max-width: 1120px; margin: 0 auto; align-items: start; }
  .capsule-intro { padding-top: clamp(0rem, 7vw, 5rem); }
  .capsule-intro h1 { max-width: 10ch; margin: var(--space-3) 0 var(--space-4); font-size: clamp(3.3rem, 7vw, 6.5rem); letter-spacing: -.07em; line-height: .93; }
  .capsule-intro p { max-width: 34rem; color: var(--text-dim); font-size: 1.05rem; line-height: 1.65; }
  .capsule-note { display: flex; gap: var(--space-2); align-items: flex-start; max-width: 30rem; margin-top: var(--space-6); color: var(--text-faint); font-size: var(--text-xs); line-height: 1.5; }
  .capsule-note::before { content: ""; width: 7px; height: 7px; flex: 0 0 7px; margin-top: .32rem; border-radius: 50%; background: #63e2d0; box-shadow: 0 0 0 4px rgba(99,226,208,.11), 0 0 14px rgba(99,226,208,.58); }
  .capsule-panel { position: relative; overflow: hidden; padding: clamp(1.25rem, 3vw, 2rem); border: 1px solid rgba(239, 205, 255, .22); border-radius: 24px; background: linear-gradient(145deg, rgba(61, 44, 82, .94), rgba(25, 18, 37, .95)); box-shadow: 0 28px 70px rgba(0,0,0,.35), inset 0 1px rgba(255,255,255,.07); }
  .capsule-panel::before { content: ""; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(circle at 100% 0%, rgba(255, 139, 153, .12), transparent 34%); }
  .capsule-panel > * { position: relative; }
  .capsule-panel-head { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); padding-bottom: var(--space-5); margin-bottom: var(--space-5); border-bottom: 1px solid var(--border); }
  .capsule-panel-head strong { font-size: var(--text-lg); }
  .studio-kicker { color: var(--text-faint); font-size: .68rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
  .control-group + .control-group { margin-top: var(--space-4); }
  .control-group label { display: flex; justify-content: space-between; gap: var(--space-3); margin-bottom: var(--space-2); color: var(--text); font-size: var(--text-sm); font-weight: 600; }
  .control-group label span { color: var(--text-faint); font-size: var(--text-xs); font-weight: 400; }
  .capsule-panel textarea { min-height: 120px; }
  .capsule-run { min-height: 44px; margin-top: var(--space-5); font-size: var(--text-sm); }
  .capsule-result { margin-top: var(--space-4); padding: var(--space-3); border: 1px solid rgba(229, 195, 255, .17); border-radius: var(--radius); background: rgba(8, 5, 14, .2); }
  .capsule-result[hidden] { display: none; }
  .capsule-result p { color: var(--text-dim); font-size: var(--text-xs); line-height: 1.5; }
  .missing { max-width: 560px; margin: 13vh auto; text-align: center; }
  @media (max-width: 760px) { .capsule-nav { margin-bottom: var(--space-6); } .capsule-layout { grid-template-columns: 1fr; gap: var(--space-6); } .capsule-intro { padding: 0; } .capsule-intro h1 { font-size: clamp(3rem, 16vw, 5rem); } }
</style>
</head>
<body>
  <main class="capsule-shell">
    <nav class="capsule-nav">
      <a href="/index.html" class="brand"><span class="brand-mark"></span>FlowForge</a>
      <a id="edit-link" class="btn btn-sm btn-ghost" href="#">Edit graph</a>
    </nav>
    <section id="capsule-app" class="capsule-layout" aria-live="polite"></section>
  </main>
  <script src="/js/app.js"></script>
  <script>
    let workflowId;
    let workflow;
    let capsule;

    const escape = value => escapeHtml(value == null ? '' : String(value));

    function fieldControl(control, value) {
      const id = `control-${control.nodeId}-${control.key}`;
      const safeValue = value == null ? '' : value;
      if (control.type === 'select') {
        return `<select id="${id}" data-node="${escape(control.nodeId)}" data-key="${escape(control.key)}">${(control.options || []).map(option => `<option value="${escape(option)}"${option === safeValue ? ' selected' : ''}>${escape(option)}</option>`).join('')}</select>`;
      }
      if (control.type === 'textarea' || control.type === 'json') {
        return `<textarea id="${id}" data-node="${escape(control.nodeId)}" data-key="${escape(control.key)}"${control.type === 'json' ? ' class="mono" spellcheck="false"' : ''}>${escape(typeof safeValue === 'object' ? JSON.stringify(safeValue, null, 2) : safeValue)}</textarea>`;
      }
      const type = control.type === 'number' ? 'number' : 'text';
      return `<input id="${id}" type="${type}" data-node="${escape(control.nodeId)}" data-key="${escape(control.key)}" value="${escape(safeValue)}" placeholder="${escape(control.placeholder || '')}">`;
    }

    function currentValue(control) {
      const node = workflow.graph_json.nodes.find(item => String(item.id) === String(control.nodeId));
      return node && node.properties ? node.properties[control.key] : '';
    }

    function render() {
      const app = document.getElementById('capsule-app');
      if (!capsule || !Array.isArray(capsule.controls) || !capsule.controls.length) {
        app.innerHTML = `<div class="missing"><div class="eyebrow">Capsule is not configured</div><h1>Expose the controls that matter.</h1><p class="muted" style="margin:var(--space-4) 0 var(--space-5)">Open the graph, select a node setting, and choose Expose to build the operator experience.</p><a class="btn btn-primary" href="/workflow.html?id=${encodeURIComponent(workflowId)}">Configure capsule</a></div>`;
        return;
      }
      app.innerHTML = `
        <div class="capsule-intro">
          <div class="eyebrow">FlowForge capsule</div>
          <h1>${escape(capsule.name || workflow.name)}</h1>
          <p>${escape(capsule.description || 'A focused creative workflow.')}</p>
          <div class="capsule-note">This interface exposes only the approved creative controls. Your graph structure and provider settings remain protected.</div>
        </div>
        <form class="capsule-panel" id="capsule-form">
          <div class="capsule-panel-head"><div><div class="studio-kicker">Ready to run</div><strong>Set your direction</strong></div><span class="badge badge-active">Governed</span></div>
          ${capsule.controls.map(control => `<div class="control-group"><label for="control-${escape(control.nodeId)}-${escape(control.key)}">${escape(control.label)}<span>${escape(control.nodeTitle)}</span></label>${fieldControl(control, currentValue(control))}</div>`).join('')}
          <button type="submit" class="btn btn-primary btn-block capsule-run" id="capsule-run">Generate from this direction</button>
          <div class="capsule-result" id="capsule-result" hidden></div>
        </form>`;
      document.getElementById('capsule-form').addEventListener('submit', runCapsule);
    }

    async function runCapsule(event) {
      event.preventDefault();
      const overrides = {};
      let invalidJson = false;
      capsule.controls.forEach(control => {
        const field = document.querySelector(`[data-node="${CSS.escape(String(control.nodeId))}"][data-key="${CSS.escape(control.key)}"]`);
        if (!field) return;
        let value = field.value;
        if (control.type === 'number') value = value === '' ? '' : Number(value);
        if (control.type === 'json') {
          try { value = JSON.parse(value); } catch { invalidJson = true; field.classList.add('invalid'); }
        }
        (overrides[control.nodeId] ||= {})[control.key] = value;
      });
      const result = document.getElementById('capsule-result');
      if (invalidJson) { result.hidden = false; result.innerHTML = '<p>Please correct the highlighted JSON before running.</p>'; return; }
      const button = document.getElementById('capsule-run');
      button.disabled = true;
      button.innerHTML = '<span class="spinner"></span> Starting flow';
      try {
        const response = await apiFetch(`/api/workflows/${workflowId}/run`, { method: 'POST', body: { _flowforge_overrides: overrides } });
        if (response.error) throw new Error(response.error);
        const execution = response.execution;
        const waiting = execution.status === 'pending_external';
        result.hidden = false;
        result.innerHTML = `<div class="badge badge-${escape(execution.status)}">${waiting ? 'In progress' : escape(execution.status)}</div><p style="margin:var(--space-2) 0">${waiting ? 'The flow is waiting for a provider response. You can return to the run timeline at any time.' : 'Your workflow has completed. Review the full trace and outputs in the run timeline.'}</p><a class="btn btn-sm" href="/execution.html?id=${encodeURIComponent(execution.id)}">Open run details</a>`;
      } catch (error) {
        result.hidden = false;
        result.innerHTML = `<p style="color:var(--danger)">Could not start this flow: ${escape(error.message)}</p>`;
      } finally {
        button.disabled = false;
        button.textContent = 'Generate from this direction';
      }
    }

    async function init() {
      await requireAuth();
      workflowId = new URLSearchParams(location.search).get('id');
      if (!workflowId) throw new Error('No workflow selected');
      document.getElementById('edit-link').href = `/workflow.html?id=${encodeURIComponent(workflowId)}`;
      const data = await apiFetch(`/api/workflows/${workflowId}`);
      if (data.error) throw new Error(data.error);
      workflow = data.workflow;
      capsule = workflow.graph_json && workflow.graph_json.flowforge && workflow.graph_json.flowforge.capsule;
      render();
    }
    init().catch(error => { document.getElementById('capsule-app').innerHTML = `<div class="missing"><h1>Capsule unavailable</h1><p class="muted">${escape(error.message)}</p></div>`; });
  </script>
</body>
</html>
