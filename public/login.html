<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FlowForge — Sign in</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<main class="center-screen">
  <div class="auth-card">
    <div class="auth-head">
      <div class="brand"><span class="brand-mark"></span> FlowForge</div>
      <p>Sign in to your workspace</p>
    </div>
    <div class="card">
      <form id="login-form">
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" autocomplete="current-password" autofocus required>
        </div>
        <button type="submit" id="submit-btn" class="btn btn-primary btn-block">Sign in</button>
        <div id="error" class="form-error" role="alert"></div>
      </form>
    </div>
  </div>
</main>

<script>
// Deliberately uses raw fetch rather than apiFetch: a 401 here is the expected
// "wrong password" case, and apiFetch would bounce us back to this same page.
fetch("/api/session", { credentials: "include" })
  .then(r => r.json())
  .then(d => { if (d.authed) window.location.href = "/index.html"; })
  .catch(() => {});

const form = document.getElementById("login-form");
const passwordInput = document.getElementById("password");
const errorEl = document.getElementById("error");
const submitBtn = document.getElementById("submit-btn");

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  errorEl.textContent = "";
  submitBtn.disabled = true;
  submitBtn.innerHTML = '<span class="spinner"></span> Signing in';

  try {
    const res = await fetch("/api/auth/login", {
      method: "POST",
      credentials: "include",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password: passwordInput.value }),
    });
    const data = await res.json();

    if (res.ok && data.ok) {
      window.location.href = "/index.html";
      return;
    }
    errorEl.textContent = data.error || "Sign in failed";
    passwordInput.value = "";
    passwordInput.focus();
  } catch {
    errorEl.textContent = "Network error. Please try again.";
    passwordInput.value = "";
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = "Sign in";
  }
});
</script>
</body>
</html>
