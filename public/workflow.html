<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FlowForge — Editor</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/litegraph.js@0.7.18/css/litegraph.css">
<link rel="stylesheet" href="/css/style.css">
<style>
  html, body { height: 100%; overflow: hidden; }

  .editor { display: flex; flex-direction: column; height: 100%; }

  .name-input {
    width: 260px;
    background: transparent;
    border-color: transparent;
    font-size: var(--text-base);
    font-weight: 600;
  }
  .name-input:hover { border-color: var(--border); }

  .status-msg {
    font-size: var(--text-xs);
    color: var(--text-dim);
    display: flex;
    align-items: center;
    gap: var(--space-2);
    min-width: 0;
  }
  .status-msg a { white-space: nowrap; }

  .dirty-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--warning); flex-shrink: 0;
  }

  /* Three-pane body: palette | canvas | inspector */
  .workspace { display: flex; flex: 1; min-height: 0; }

  .palette, .inspector {
    background: var(--surface);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    overflow: hidden;
  }
  .palette { width: 208px; border-right: 1px solid var(--border); }
  .inspector { width: 320px; border-left: 1px solid var(--border); }

  .pane-head {
    padding: var(--space-3) var(--space-4);
    border-bottom: 1px solid var(--border);
    font-size: var(--text-xs);
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--text-faint);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: var(--space-2);
  }
  .pane-body { overflow-y: auto; padding: var(--space-3); flex: 1; }
  .palette-search { margin: var(--space-3) var(--space-3) 0; width: calc(100% - var(--space-6)); }

  .palette-group + .palette-group { margin-top: var(--space-4); }
  .palette-group-label {
    padding: 0 var(--space-1) var(--space-2);
    font-size: var(--text-xs);
    font-weight: 600;
    color: var(--text-faint);
  }
  .palette-item {
    display: flex;
    align-items: center;
    gap: var(--space-2);
    width: 100%;
    padding: 0.4375rem var(--space-2);
    margin-bottom: 2px;
    background: transparent;
    border: 1px solid transparent;
    border-radius: var(--radius-sm);
    color: var(--text-dim);
    font: inherit;
    font-size: var(--text-sm);
    text-align: left;
    cursor: pointer;
    transition: background 0.12s, color 0.12s;
  }
  .palette-item:hover { background: var(--surface-2); color: var(--text); border-color: var(--border); }
  .swatch { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }

  .canvas-wrap { flex: 1; position: relative; min-width: 0; background-color: var(--canvas); background-image: radial-gradient(rgba(255,255,255,.115) 1px, transparent 1px); background-size: 18px 18px; }
  #graph-canvas { display: block; width: 100%; height: 100%; }

  .canvas-hint {
    position: absolute;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    color: var(--text-faint);
    font-size: var(--text-sm);
    pointer-events: none;
    max-width: 320px;
    line-height: 1.7;
  }
  .canvas-hint strong { color: var(--text-dim); display: block; margin-bottom: var(--space-2); font-size: var(--text-base); }
  .canvas-hint { padding: var(--space-5); border: 1px solid var(--border); border-radius: var(--radius-lg); background: rgba(18,19,24,.78); backdrop-filter: blur(10px); box-shadow: var(--shadow); }

  .canvas-tools {
    position: absolute;
    left: var(--space-3); bottom: var(--space-3);
    display: flex;
    align-items: center;
    gap: var(--space-1);
    padding: var(--space-1);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    box-shadow: var(--shadow-sm);
  }
  .canvas-tools .btn { border-color: transparent; background: transparent; }
  .canvas-tools .btn:hover { background: var(--surface-2); }
  .zoom-level {
    min-width: 46px;
    text-align: center;
    font-size: var(--text-xs);
    font-variant-numeric: tabular-nums;
    color: var(--text-dim);
    user-select: none;
  }
  .tool-sep { width: 1px; align-self: stretch; background: var(--border); margin: 0 var(--space-1); }

  .inspector-title {
    font-size: var(--text-base);
    font-weight: 600;
    margin-bottom: var(--space-1);
  }
  .inspector-type {
    font-family: var(--font-mono);
    font-size: var(--text-xs);
    color: var(--text-faint);
    margin-bottom: var(--space-4);
    word-break: break-all;
  }
  .inspector-desc {
    padding: var(--space-3);
    margin-bottom: var(--space-4);
    background: var(--surface-2);
    border-radius: var(--radius-sm);
    color: var(--text-dim);
    font-size: var(--text-xs);
    line-height: 1.6;
  }
  .inspector-foot {
    padding: var(--space-3) var(--space-4);
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }

  .io-list { display: flex; flex-wrap: wrap; gap: var(--space-1); margin-top: var(--space-1); }
  .io-chip {
    padding: 0.125rem 0.375rem;
    background: var(--surface-2);
    border-radius: 3px;
    font-family: var(--font-mono);
    font-size: 0.6875rem;
    color: var(--text-dim);
  }

  .copy-row { display: flex; gap: var(--space-2); }
  .copy-row input { font-family: var(--font-mono); font-size: 0.6875rem; }

  .invalid { border-color: var(--danger) !important; }
  .invalid-msg { margin-top: var(--space-1); color: var(--danger); font-size: var(--text-xs); }

  @media (max-width: 1100px) {
    .palette { width: 168px; }
    .inspector { width: 280px; }
  }
  .inspector-toggle { display: none; }
  @media (max-width: 760px) {
    .toolbar { overflow-x: auto; }
    .toolbar .status-msg { display: none; }
    .name-input { width: 180px; }
    .palette { width: 162px; }
    .inspector { position: absolute; z-index: 5; right: 0; width: min(320px, 88vw); height: 100%; box-shadow: var(--shadow-lg); transform: translateX(102%); transition: transform 180ms ease; }
    .inspector.is-open { transform: translateX(0); }
    .inspector-toggle { display: inline-flex; }
    .canvas-tools { left: var(--space-2); bottom: var(--space-2); }
  }
</style>
</head>
<body>

<div class="editor">
  <div class="toolbar">
    <a href="/index.html" class="btn btn-ghost btn-sm">← Workflows</a>
    <input type="text" id="name-input" class="name-input" placeholder="Untitled workflow" aria-label="Workflow name">
    <div class="toolbar-spacer"></div>
    <span class="status-msg" id="status-msg"></span>
    <label class="checkbox-row" title="Inactive workflows won't fire from webhooks or schedules">
      <input type="checkbox" id="active-toggle">
      <span>Active</span>
    </label>
    <button id="inspector-toggle" class="btn btn-sm inspector-toggle" aria-controls="inspector" aria-expanded="false">Inspect</button>
    <button id="save-btn" class="btn btn-sm">Save</button>
    <button id="run-btn" class="btn btn-primary btn-sm">Run</button>
  </div>

  <div class="workspace">
    <aside class="palette">
      <div class="pane-head">Nodes</div>
      <input type="search" id="palette-search" class="palette-search" placeholder="Find a node" aria-label="Find a node">
      <div class="pane-body" id="palette-body"></div>
    </aside>

    <div class="canvas-wrap" id="canvas-wrap">
      <canvas id="graph-canvas"></canvas>
      <div class="canvas-hint" id="canvas-hint">
        <strong>Start with a trigger</strong>
        Pick a node from the left to add it, then drag between ports to connect.
      </div>
      <div class="canvas-tools">
        <button id="zoom-out-btn" class="btn btn-sm" title="Zoom out">&minus;</button>
        <span class="zoom-level" id="zoom-level">100%</span>
        <button id="zoom-in-btn" class="btn btn-sm" title="Zoom in">+</button>
        <span class="tool-sep"></span>
        <button id="reset-zoom-btn" class="btn btn-sm" title="Reset to 100%">100%</button>
        <button id="fit-btn" class="btn btn-sm" title="Fit all nodes in view">Fit</button>
      </div>
    </div>

    <aside class="inspector" id="inspector">
      <div class="pane-head">Inspector</div>
      <div class="pane-body" id="inspector-body"></div>
      <div class="inspector-foot" id="inspector-foot" hidden>
        <button id="delete-node-btn" class="btn btn-danger btn-sm btn-block">Delete node</button>
      </div>
    </aside>
  </div>
</div>

<script src="/js/app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/litegraph.js@0.7.18/build/litegraph.min.js"></script>
<script>
/* ===========================================================================
   Node schemas — the single source of truth.
   The palette, the registered LiteGraph node classes, and the inspector form
   are all generated from this list, so a node can never drift out of sync
   between the three. Adding a node type here is the ONLY frontend change
   needed (plus its executor in api/_lib/nodes/).

   `inputs`/`outputs` names MUST match the backend exactly: the engine resolves
   data between nodes by slot NAME (see _resolve_inputs in api/_lib/engine.py).
   =========================================================================== */

const CATEGORY_COLORS = {
  Triggers: "#22c55e",
  Actions:  "#7c5cff",
  AI:       "#e0724d",
  Logic:    "#f59e0b",
  Data:     "#38bdf8",
};

const NODE_SCHEMAS = [
  {
    type: "trigger/manual", title: "Manual Trigger", category: "Triggers",
    description: "Starts the workflow when you press Run. The payload you pass to the run endpoint arrives on the output.",
    inputs: [], outputs: ["payload"], fields: [],
  },
  {
    type: "trigger/webhook", title: "Webhook Trigger", category: "Triggers",
    description: "Starts the workflow when an external service POSTs to this workflow's webhook URL. The JSON body arrives on the output.",
    inputs: [], outputs: ["payload"], fields: [], showWebhookUrl: true,
  },
  {
    type: "trigger/schedule", title: "Schedule Trigger", category: "Triggers",
    description: "Starts the workflow on a cron schedule. Checked every minute; the workflow must be Active for it to fire.",
    inputs: [], outputs: ["payload"],
    fields: [
      { key: "cron_expression", label: "Cron expression", type: "text", default: "*/15 * * * *",
        hint: "Standard 5-field cron, in UTC. e.g. */15 * * * * runs every 15 minutes." },
    ],
  },
  {
    type: "action/http_request", title: "HTTP Request", category: "Actions",
    description: "Makes an outbound HTTP call. Any status code counts as success — branch on status_code downstream if you need to treat 4xx/5xx as failure.",
    inputs: ["url", "body"], outputs: ["status_code", "headers", "body"],
    fields: [
      { key: "method", label: "Method", type: "select", default: "GET",
        options: ["GET", "POST", "PUT", "PATCH", "DELETE"] },
      { key: "url", label: "URL", type: "text", default: "", placeholder: "https://api.example.com/endpoint",
        hint: "A connected url input overrides this value." },
      { key: "headers", label: "Headers", type: "json", default: "{}" },
      { key: "body", label: "Body", type: "json", default: "{}",
        hint: "Sent as JSON. A connected body input overrides this value." },
      { key: "timeout_seconds", label: "Timeout (seconds)", type: "number", default: 20 },
    ],
  },
  {
    type: "action/supabase_query", title: "Supabase Query", category: "Actions",
    description: "Reads or writes your own Supabase tables. Runs with the service role key, so it bypasses row level security.",
    inputs: ["data"], outputs: ["data"],
    fields: [
      { key: "table", label: "Table", type: "text", default: "", placeholder: "my_table" },
      { key: "operation", label: "Operation", type: "select", default: "select",
        options: ["select", "insert", "update", "delete"] },
      { key: "filters", label: "Filters", type: "json", default: "{}",
        hint: "Column/value pairs, applied as equality filters. Used by select, update and delete." },
      { key: "data", label: "Row data", type: "json", default: "{}",
        hint: "Required for insert and update. A connected data input overrides this." },
    ],
  },
  {
    type: "action/fal_generate_image", title: "Generate Image", category: "AI",
    description: "Generates an image with fal.ai and waits for the result. Use the image_url output to pass the result along.",
    inputs: ["prompt"], outputs: ["result", "image_url"],
    fields: [
      { key: "model", label: "Model", type: "text", default: "fal-ai/flux/dev",
        hint: "Any fal.ai model id, e.g. fal-ai/flux/dev." },
      { key: "input", label: "Model input", type: "json", default: '{"prompt": ""}',
        hint: "Passed straight to the model. A connected prompt input overrides the prompt field." },
    ],
  },
  {
    type: "action/fal_train_lora", title: "Train LoRA", category: "AI",
    description: "Submits a LoRA training job to fal.ai. Training takes minutes, so the workflow pauses here and resumes automatically when the job finishes.",
    inputs: [], outputs: ["result"],
    fields: [
      { key: "model", label: "Training endpoint", type: "text", default: "fal-ai/flux-lora-fast-training" },
      { key: "input", label: "Training input", type: "json",
        default: '{\n  "images_data_url": "",\n  "trigger_word": ""\n}',
        hint: "images_data_url should point to a zip of your training images." },
    ],
  },
  {
    type: "action/llm_prompt", title: "LLM Prompt", category: "AI",
    description: "Sends a prompt to any model on OpenRouter and returns the generated text.",
    inputs: ["prompt"], outputs: ["text", "raw"],
    fields: [
      { key: "model", label: "Model", type: "text", default: "deepseek/deepseek-v3.2",
        hint: "Any OpenRouter model slug. DeepSeek is the cheap default." },
      { key: "system_prompt", label: "System prompt", type: "textarea", default: "" },
      { key: "user_prompt", label: "User prompt", type: "textarea", default: "",
        hint: "A connected prompt input replaces this entirely." },
    ],
  },
  {
    type: "action/delay", title: "Delay", category: "Actions",
    description: "Pauses the workflow, then continues. The run parks in pending_external and a background poller resumes it — whatever came in on the input is passed straight through.",
    inputs: ["payload"], outputs: ["payload"],
    fields: [
      { key: "seconds", label: "Wait (seconds)", type: "number", default: 300 },
    ],
  },
  {
    type: "logic/condition", title: "Condition", category: "Logic",
    description: "Compares two values and outputs true or false. Note: this does not branch the graph — downstream nodes still run. Use the boolean as data.",
    inputs: ["value1", "value2"], outputs: ["result"],
    fields: [
      { key: "left", label: "Left value", type: "text", default: "{{value1}}",
        hint: "Use {{value1}} or {{value2}} to reference a connected input, or type a literal." },
      { key: "operator", label: "Operator", type: "select", default: "eq",
        options: ["eq", "neq", "gt", "lt", "gte", "lte", "contains"] },
      { key: "right", label: "Right value", type: "text", default: "{{value2}}" },
    ],
  },
  {
    type: "data/set", title: "Set / Transform", category: "Data",
    description: "Reshapes data into named output fields. Deliberately not code evaluation — mappings only.",
    inputs: ["value1", "value2"], outputs: ["out1", "out2", "out3"],
    fields: [
      { key: "mappings", label: "Mappings", type: "json",
        default: '[\n  { "output_name": "out1", "source": "{{value1}}" }\n]',
        hint: "Name each output and where it comes from. Only out1-out3 are wireable downstream." },
    ],
  },
];

const SCHEMA_BY_TYPE = Object.fromEntries(NODE_SCHEMAS.map(s => [s.type, s]));

/* Which fields hold JSON. Kept as STRINGS while editing so the textarea stays
   faithful to what you typed (including invalid intermediate states), and
   converted to real objects only on save — the executors expect dicts/lists. */
function jsonFieldKeys(type) {
  const schema = SCHEMA_BY_TYPE[type];
  if (!schema) return [];
  return schema.fields.filter(f => f.type === "json").map(f => f.key);
}

/* ---------- Register node classes from the schemas ---------- */

for (const schema of NODE_SCHEMAS) {
  function NodeClass() {
    for (const name of schema.inputs) this.addInput(name, "");
    for (const name of schema.outputs) this.addOutput(name, "");
    this.properties = {};
    for (const f of schema.fields) this.properties[f.key] = f.default;
    this.color = CATEGORY_COLORS[schema.category] || "#7c5cff";
    this.bgcolor = "#171b24";
    this.size = [190, Math.max(30, 26 * Math.max(schema.inputs.length, schema.outputs.length) + 8)];
  }
  NodeClass.title = schema.title;
  // No onExecute: these nodes are structural config only. Execution happens
  // server-side in api/_lib/engine.py, never in the browser.
  LiteGraph.registerNodeType(schema.type, NodeClass);
}

/* ---------- Graph <-> API translation ---------- */

function graphForSave(graphData) {
  const out = JSON.parse(JSON.stringify(graphData));
  for (const node of out.nodes || []) {
    const keys = jsonFieldKeys(node.type);
    if (!keys.length || !node.properties) continue;
    for (const key of keys) {
      const raw = node.properties[key];
      if (typeof raw !== "string") continue;
      try {
        node.properties[key] = JSON.parse(raw);
      } catch {
        node.properties[key] = key === "mappings" ? [] : {};
      }
    }
  }
  return out;
}

function graphAfterLoad(graphData) {
  if (!graphData || !graphData.nodes) return graphData;
  for (const node of graphData.nodes) {
    const keys = jsonFieldKeys(node.type);
    if (!keys.length || !node.properties) continue;
    for (const key of keys) {
      const raw = node.properties[key];
      if (raw !== null && typeof raw === "object") {
        node.properties[key] = JSON.stringify(raw, null, 2);
      }
    }
  }
  return graphData;
}

/* ---------- State ---------- */

let graph, canvas, canvasEl, workflowId;
let selectedNode = null;
let dirty = false;

const els = {};

function setStatus(html, { spinner = false } = {}) {
  els.status.innerHTML = (spinner ? '<span class="spinner"></span>' : "") + (html || "");
}

function markDirty() {
  if (dirty) return;
  dirty = true;
  renderDirty();
}

function renderDirty() {
  if (dirty) setStatus('<span class="dirty-dot"></span> Unsaved changes');
  else setStatus("");
}

/* ---------- Palette ---------- */

function renderPalette(query = "") {
  const groups = {};
  const normalizedQuery = query.trim().toLowerCase();
  const matches = NODE_SCHEMAS.filter(s => !normalizedQuery ||
    `${s.title} ${s.category} ${s.description}`.toLowerCase().includes(normalizedQuery));
  for (const s of matches) (groups[s.category] ||= []).push(s);

  els.palette.innerHTML = Object.keys(groups).length ? Object.entries(groups).map(([category, items]) => `
    <div class="palette-group">
      <div class="palette-group-label">${escapeHtml(category)}</div>
      ${items.map(s => `
        <button class="palette-item" data-type="${escapeHtml(s.type)}" title="${escapeHtml(s.description)}">
          <span class="swatch" style="background:${CATEGORY_COLORS[category]}"></span>
          <span>${escapeHtml(s.title)}</span>
        </button>
      `).join("")}
    </div>
  `).join("") : `<div class="empty-state" style="padding:var(--space-5) var(--space-2)"><p style="margin:0">No matching nodes.</p></div>`;

  els.palette.querySelectorAll(".palette-item").forEach(btn => {
    btn.addEventListener("click", () => addNode(btn.dataset.type));
  });
}

let addCount = 0;
function addNode(type) {
  const node = LiteGraph.createNode(type);
  if (!node) return;
  // Drop it near the middle of whatever the user is currently looking at,
  // nudged each time so repeated adds don't stack into one pile.
  const ds = canvas.ds;
  const cx = (canvasEl.width * 0.5) / ds.scale - ds.offset[0];
  const cy = (canvasEl.height * 0.5) / ds.scale - ds.offset[1];
  const step = (addCount++ % 6) * 28;
  node.pos = [cx - 95 + step, cy - 40 + step];
  graph.add(node);

  // canvas.selectNode() only updates LiteGraph's own selection — the
  // onNodeSelected hook fires from the mouse-click path, not from here — so
  // drive the inspector ourselves or a newly added node opens blank.
  canvas.selectNode(node);
  selectedNode = node;
  renderInspector();

  markDirty();
  updateHint();
}

function deleteSelected() {
  if (!selectedNode) return;
  const node = selectedNode;
  selectedNode = null;
  canvas.deselectAllNodes();
  graph.remove(node);
  renderInspector();
  markDirty();
  updateHint();
  canvas.setDirty(true, true);
}

function updateHint() {
  els.hint.hidden = (graph._nodes || []).length > 0;
}

/* ---------- Inspector ---------- */

function renderInspector() {
  const node = selectedNode;
  els.inspectorFoot.hidden = !node;

  if (!node) {
    els.inspector.innerHTML = `
      <div class="empty-state" style="padding: var(--space-6) var(--space-2);">
        <p style="margin:0">Select a node to configure it.</p>
      </div>`;
    return;
  }

  const schema = SCHEMA_BY_TYPE[node.type];
  if (!schema) {
    els.inspector.innerHTML = `<div class="banner">Unknown node type: ${escapeHtml(node.type)}</div>`;
    return;
  }

  const io = (label, names) => names.length ? `
    <div class="field">
      <label>${label}</label>
      <div class="io-list">${names.map(n => `<span class="io-chip">${escapeHtml(n)}</span>`).join("")}</div>
    </div>` : "";

  const webhookBlock = schema.showWebhookUrl ? `
    <div class="field">
      <label>Webhook URL</label>
      <div class="copy-row">
        <input type="text" id="webhook-url" readonly value="${escapeHtml(window.location.origin + "/api/webhook/" + workflowId)}">
        <button class="btn btn-sm" id="copy-webhook">Copy</button>
      </div>
      <div class="field-hint">POST JSON here to trigger this workflow. Requires the workflow to be Active.</div>
    </div>` : "";

  els.inspector.innerHTML = `
    <div class="inspector-title">${escapeHtml(schema.title)}</div>
    <div class="inspector-type">${escapeHtml(schema.type)}</div>
    <div class="inspector-desc">${escapeHtml(schema.description)}</div>
    ${webhookBlock}
    ${schema.fields.map(f => renderField(f, node.properties[f.key])).join("")}
    ${io("Inputs", schema.inputs)}
    ${io("Outputs", schema.outputs)}
  `;

  wireInspector(node, schema);
}

function renderField(f, value) {
  const id = `f-${f.key}`;
  const hint = f.hint ? `<div class="field-hint">${escapeHtml(f.hint)}</div>` : "";
  const val = value === undefined || value === null ? "" : value;
  let control;

  if (f.type === "select") {
    control = `<select id="${id}" data-key="${escapeHtml(f.key)}">${
      f.options.map(o => `<option value="${escapeHtml(o)}"${o === val ? " selected" : ""}>${escapeHtml(o)}</option>`).join("")
    }</select>`;
  } else if (f.type === "number") {
    control = `<input type="number" id="${id}" data-key="${escapeHtml(f.key)}" value="${escapeHtml(String(val))}">`;
  } else if (f.type === "json") {
    control = `<textarea id="${id}" class="mono" data-key="${escapeHtml(f.key)}" data-json="1" rows="6" spellcheck="false">${escapeHtml(String(val))}</textarea>`;
  } else if (f.type === "textarea") {
    control = `<textarea id="${id}" data-key="${escapeHtml(f.key)}" rows="3">${escapeHtml(String(val))}</textarea>`;
  } else {
    control = `<input type="text" id="${id}" data-key="${escapeHtml(f.key)}" value="${escapeHtml(String(val))}"${
      f.placeholder ? ` placeholder="${escapeHtml(f.placeholder)}"` : ""}>`;
  }

  return `<div class="field">
    <label for="${id}">${escapeHtml(f.label)}</label>
    ${control}
    ${hint}
    <div class="invalid-msg" id="${id}-err" hidden></div>
  </div>`;
}

function wireInspector(node, schema) {
  els.inspector.querySelectorAll("[data-key]").forEach(input => {
    const key = input.dataset.key;
    const isJson = input.dataset.json === "1";
    const errEl = document.getElementById(`${input.id}-err`);

    input.addEventListener("input", () => {
      let value = input.value;
      if (input.type === "number") value = value === "" ? "" : Number(value);

      if (isJson) {
        // Store the raw text either way — a half-typed object shouldn't be
        // discarded — but flag it so it's obvious before you hit Save.
        try {
          JSON.parse(value);
          input.classList.remove("invalid");
          errEl.hidden = true;
        } catch (err) {
          input.classList.add("invalid");
          errEl.textContent = "Invalid JSON — will be saved as empty.";
          errEl.hidden = false;
        }
      }

      node.properties[key] = value;
      markDirty();
    });
  });

  const copyBtn = document.getElementById("copy-webhook");
  if (copyBtn) {
    copyBtn.addEventListener("click", async () => {
      const url = document.getElementById("webhook-url").value;
      try {
        await navigator.clipboard.writeText(url);
        copyBtn.textContent = "Copied";
        setTimeout(() => { copyBtn.textContent = "Copy"; }, 1500);
      } catch {
        document.getElementById("webhook-url").select();
      }
    });
  }
}

/* ---------- Canvas sizing, HiDPI, and zoom ----------

   The backing store is sized at devicePixelRatio so nodes and text stay sharp:
   a 1x buffer stretched across a 2x display is what made the canvas look soft.
   LiteGraph has no concept of DPR, so we carry it inside ds.scale and treat
   "zoom" as ds.scale / DPR everywhere it's read or displayed.

   That has one consequence worth spelling out: LiteGraph derives pointer
   positions from getBoundingClientRect(), which reports CSS pixels, then
   divides by ds.scale. With DPR folded into that scale, every click would
   land at half the intended spot — so adjustMouseEvent is patched below to
   work in the same device-pixel space the drawing uses.
*/

const DPR = Math.min(window.devicePixelRatio || 1, 2);
const MIN_ZOOM = 0.25;
const MAX_ZOOM = 2.5;

(function patchPointerForDPR() {
  const original = LGraphCanvas.prototype.adjustMouseEvent;
  LGraphCanvas.prototype.adjustMouseEvent = function (e) {
    original.call(this, e);
    if (!this.canvas) return;
    const b = this.canvas.getBoundingClientRect();
    e.canvasX = ((e.clientX - b.left) * DPR) / this.ds.scale - this.ds.offset[0];
    e.canvasY = ((e.clientY - b.top) * DPR) / this.ds.scale - this.ds.offset[1];
    // Drag deltas also come back in CSS pixels — without this, dragging a node
    // on a 2x display moves it at half the speed of the cursor.
    e.deltaX *= DPR;
    e.deltaY *= DPR;
  };
})();

function currentZoom() { return canvas.ds.scale / DPR; }

function syncZoomLabel() {
  if (els.zoom) els.zoom.textContent = Math.round(currentZoom() * 100) + "%";
}

/* Set zoom while keeping a world point pinned — the viewport centre by
   default, so zooming never drifts away from what you were looking at. */
function setZoom(zoom, anchor) {
  const ds = canvas.ds;
  const z = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, zoom));
  const cx = anchor ? anchor[0] : canvasEl.width / (2 * ds.scale) - ds.offset[0];
  const cy = anchor ? anchor[1] : canvasEl.height / (2 * ds.scale) - ds.offset[1];
  ds.scale = z * DPR;
  ds.offset = [
    canvasEl.width / (2 * ds.scale) - cx,
    canvasEl.height / (2 * ds.scale) - cy,
  ];
  syncZoomLabel();
  canvas.setDirty(true, true);
}

function resizeCanvas() {
  const wrap = document.getElementById("canvas-wrap");
  const w = wrap.clientWidth, h = wrap.clientHeight;
  // CSS size stays in layout pixels; the buffer behind it is DPR times larger.
  canvasEl.style.width = w + "px";
  canvasEl.style.height = h + "px";
  if (canvas) {
    canvas.resize(w * DPR, h * DPR);
    canvas.setDirty(true, true);
  } else {
    canvasEl.width = w * DPR;
    canvasEl.height = h * DPR;
  }
}

/* Frame every node in view. LiteGraph's transform is
   screen = (world + offset) * scale, so centring world point c means
   offset = viewport / (2 * scale) - c.

   Clamped to 50-100%: unclamped, a sprawling graph shrinks into unreadable
   mush, and a two-node graph balloons to a comic zoom on open. */
function fitToView() {
  const nodes = graph._nodes || [];
  if (!nodes.length) { setZoom(1); return; }

  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const n of nodes) {
    minX = Math.min(minX, n.pos[0]);
    minY = Math.min(minY, n.pos[1] - LiteGraph.NODE_TITLE_HEIGHT);
    maxX = Math.max(maxX, n.pos[0] + n.size[0]);
    maxY = Math.max(maxY, n.pos[1] + n.size[1]);
  }

  const pad = 80;
  const fitted = Math.min(
    (canvasEl.width / DPR) / (maxX - minX + pad * 2),
    (canvasEl.height / DPR) / (maxY - minY + pad * 2)
  );
  setZoom(
    Math.min(Math.max(fitted, 0.5), 1),
    [(minX + maxX) / 2, (minY + maxY) / 2]
  );
}

/* ---------- Save / run ---------- */

async function saveWorkflow() {
  const res = await apiFetch(`/api/workflows/${workflowId}`, {
    method: "PUT",
    body: {
      name: els.name.value.trim() || "Untitled workflow",
      graph_json: graphForSave(graph.serialize()),
      is_active: els.active.checked,
    },
  });
  if (res && res.error) throw new Error(res.error);
  dirty = false;
  return res;
}

async function onSave() {
  els.save.disabled = true;
  setStatus("Saving…", { spinner: true });
  try {
    await saveWorkflow();
    setStatus("Saved");
    setTimeout(() => { if (!dirty) setStatus(""); }, 2000);
  } catch (err) {
    setStatus(`<span style="color:var(--danger)">Save failed: ${escapeHtml(err.message)}</span>`);
  } finally {
    els.save.disabled = false;
  }
}

async function onRun() {
  els.run.disabled = true;
  els.save.disabled = true;
  try {
    // Run executes what's persisted, so always flush the canvas first —
    // otherwise you'd be running a stale version of what you're looking at.
    setStatus("Saving…", { spinner: true });
    await saveWorkflow();

    setStatus("Running…", { spinner: true });
    const res = await apiFetch(`/api/workflows/${workflowId}/run`, { method: "POST", body: {} });
    if (res && res.error) throw new Error(res.error);

    const ex = res.execution;
    const label = ex.status === "pending_external" ? "waiting on external job" : ex.status;
    setStatus(
      `<span class="badge badge-${escapeHtml(ex.status)}">${escapeHtml(label)}</span>` +
      ` <a href="/execution.html?id=${escapeHtml(ex.id)}">View run →</a>`
    );
  } catch (err) {
    setStatus(`<span style="color:var(--danger)">Run failed: ${escapeHtml(err.message)}</span>`);
  } finally {
    els.run.disabled = false;
    els.save.disabled = false;
  }
}

/* ---------- Boot ---------- */

async function init() {
  await requireAuth();

  els.name = document.getElementById("name-input");
  els.active = document.getElementById("active-toggle");
  els.save = document.getElementById("save-btn");
  els.run = document.getElementById("run-btn");
  els.status = document.getElementById("status-msg");
  els.palette = document.getElementById("palette-body");
  els.paletteSearch = document.getElementById("palette-search");
  els.inspector = document.getElementById("inspector-body");
  els.inspectorFoot = document.getElementById("inspector-foot");
  els.hint = document.getElementById("canvas-hint");
  els.zoom = document.getElementById("zoom-level");

  workflowId = new URLSearchParams(window.location.search).get("id");
  if (!workflowId) {
    document.body.innerHTML =
      '<div class="center-screen"><div class="card auth-card" style="text-align:center">' +
      '<h2>No workflow selected</h2><p style="color:var(--text-dim);margin:var(--space-3) 0">' +
      'This page needs a workflow id.</p>' +
      '<a href="/index.html" class="btn btn-primary btn-block">Back to workflows</a></div></div>';
    return;
  }

  canvasEl = document.getElementById("graph-canvas");
  graph = new LGraph();
  canvas = new LGraphCanvas(canvasEl, graph);
  canvas.background_image = null;
  canvas.render_shadows = false;
  canvas.always_render_background = false;
  // No graph.start(): our nodes have no onExecute, so the execution loop would
  // just burn CPU. LGraphCanvas runs its own render loop regardless.

  // ds.scale carries DPR, so DPR *is* 100%. Bound LiteGraph's own wheel-zoom
  // to the same limits the buttons enforce.
  canvas.ds.scale = DPR;
  canvas.ds.min_scale = MIN_ZOOM * DPR;
  canvas.ds.max_scale = MAX_ZOOM * DPR;

  canvas.onNodeSelected = (node) => { selectedNode = node; renderInspector(); };
  canvas.onNodeDeselected = () => { selectedNode = null; renderInspector(); };
  canvas.onNodeMoved = () => markDirty();

  // Several hooks rather than one: onAfterChange misses wiring and drags, so
  // without these you could rearrange a graph and lose it on navigate.
  graph.onNodeAdded = () => { markDirty(); updateHint(); };
  graph.onNodeRemoved = () => { markDirty(); updateHint(); };
  graph.onConnectionChange = () => markDirty();
  graph.onAfterChange = () => { markDirty(); updateHint(); };

  renderPalette();
  els.paletteSearch.addEventListener("input", () => renderPalette(els.paletteSearch.value));
  renderInspector();
  resizeCanvas();
  window.addEventListener("resize", resizeCanvas);

  try {
    const { workflow, error } = await apiFetch(`/api/workflows/${workflowId}`);
    if (error) throw new Error(error);
    els.name.value = workflow.name || "";
    els.active.checked = !!workflow.is_active;
    if (workflow.graph_json && (workflow.graph_json.nodes || []).length) {
      graph.configure(graphAfterLoad(workflow.graph_json));
      fitToView();
    }
  } catch (err) {
    setStatus(`<span style="color:var(--danger)">Could not load workflow: ${escapeHtml(err.message)}</span>`);
    return;
  }

  // configure() fires onAfterChange; loading isn't an edit.
  dirty = false;
  renderDirty();
  updateHint();
  canvas.setDirty(true, true);

  els.save.addEventListener("click", onSave);
  els.run.addEventListener("click", onRun);
  els.name.addEventListener("input", markDirty);
  els.active.addEventListener("change", markDirty);

  document.getElementById("fit-btn").addEventListener("click", fitToView);
  document.getElementById("reset-zoom-btn").addEventListener("click", () => setZoom(1));
  document.getElementById("zoom-in-btn").addEventListener("click", () => setZoom(currentZoom() * 1.25));
  document.getElementById("zoom-out-btn").addEventListener("click", () => setZoom(currentZoom() / 1.25));

  // LiteGraph mutates ds.scale directly on wheel-zoom and never emits an event,
  // so mirror it into the readout each frame rather than guessing.
  let lastScale = null;
  (function trackZoom() {
    if (canvas.ds.scale !== lastScale) { lastScale = canvas.ds.scale; syncZoomLabel(); }
    requestAnimationFrame(trackZoom);
  })();

  document.getElementById("delete-node-btn").addEventListener("click", deleteSelected);

  const inspectorToggle = document.getElementById("inspector-toggle");
  inspectorToggle.addEventListener("click", () => {
    const open = document.querySelector(".inspector").classList.toggle("is-open");
    inspectorToggle.setAttribute("aria-expanded", String(open));
  });

  // Delete/Backspace removes the selected node — but never while the caret is
  // in a form control, or typing in the inspector would nuke the node.
  document.addEventListener("keydown", (e) => {
    if (e.key !== "Delete" && e.key !== "Backspace") return;
    const t = e.target;
    if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.tagName === "SELECT" || t.isContentEditable)) return;
    if (!selectedNode) return;
    e.preventDefault();
    deleteSelected();
  });

  // Cmd/Ctrl+S saves, as in any real editor.
  document.addEventListener("keydown", (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "s") {
      e.preventDefault();
      onSave();
    }
  });

  window.addEventListener("beforeunload", (e) => {
    if (!dirty) return;
    e.preventDefault();
    e.returnValue = "";
  });
}

document.addEventListener("DOMContentLoaded", init);
</script>
</body>
</html>
